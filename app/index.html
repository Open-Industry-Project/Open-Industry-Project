<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8" />
    <!-- The editor opts out of browser translation, deliberately (the landing page does not;
         it stays translatable). Chrome rewraps translated text nodes in <font>, so React then
         removes/updates a node whose parent moved and the page goes blank. And most text in here is
         identity or syntax rather than prose: ST keywords in Monaco, tag names, part names -
         a translated tag in the Inspector no longer matches the one in the ST that references
         it. Viewport text is canvas-drawn and untranslatable anyway, so even the good case is
         half-English. -->
    <meta name="google" content="notranslate" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- Home-screen app settings. iOS reads them from whichever page was added to the home
         screen, so the landing (/index.html) has the same block. Keep the two in sync.

         black-translucent draws the page behind the status bar. The phone toolbar adds
         env(safe-area-inset-top) as top padding, so its background fills the area behind the
         status bar. iOS 26 also blurs that area, and about 40pt below it, unless the page has a
         fixed or sticky bar at the top. That is why the phone toolbar is sticky (mobile.css,
         .app.mobile .toolbar). An opaque status bar does not avoid the blur (tested on an iPhone).

         theme-color matches the toolbar background (--panel). Safari 26 ignores it; Chrome and
         Android use it to colour their browser bars. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OIP" />
    <meta name="theme-color" content="#202225" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f6f7" media="(prefers-color-scheme: light)" />
    <!-- The stored Light / Dark choice (src/editor/appearance.ts), stamped before anything paints so the
         boot skeleton below comes up in it rather than in the OS's scheme and then flipping. The one
         script ahead of the module graph; it only reads a preference. -->
    <script>
      try {
        var t = localStorage.getItem('oip-web/appearance')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Front-run the default scene's building shell. building.ts fetches these GLBs +
      textures eagerly (ungated) the moment the editor's render module boots, but
      without these hints they wait behind the app chunk's own download + parse.
      Preloading streams the building bytes in parallel with JS startup, so the
      first-load cover, which holds until the building is fully textured (gltf.ts
      coverReady), lifts sooner. Paths are stable/unhashed and same-origin.

      `crossorigin` is required even though these are same-origin: an `as="fetch"` preload
      without it is a no-CORS request while the runtime loads are CORS-mode (three's
      ImageBitmapLoader fetch() and GLTFLoader XHR both are), so Chrome refuses to match
      them and logs "A preload for <url> is found, but is not used because the request
      credentials mode does not match" (measured on the prod build for all 16 of these).
      The preloads would still warm the HTTP cache, so a waterfall shows no double download,
      but the loader would re-issue every request instead of adopting the in-flight preload,
      losing most of the head start this block exists for.
    -->
    <link rel="preload" as="fetch" crossorigin href="/models/building/Roof_A.glb" />
    <link rel="preload" as="fetch" crossorigin href="/models/building/Roof_B.glb" />
    <link rel="preload" as="fetch" crossorigin href="/models/building/Wall_A.glb" />
    <link rel="preload" as="fetch" crossorigin href="/models/building/Wall_B.glb" />
    <link rel="preload" as="fetch" crossorigin href="/models/building/Wall_C.glb" />
    <link rel="preload" as="fetch" crossorigin href="/models/building/Wall_D.glb" />
    <link rel="preload" as="fetch" crossorigin href="/models/building/Roof_A_Wall.glb" />
    <link rel="preload" as="fetch" crossorigin href="/models/building/Dock_Wall_A.glb" />
    <link rel="preload" as="fetch" crossorigin href="/models/building/Dock_Wall_B.glb" />
    <link rel="preload" as="fetch" crossorigin href="/models/building/Personnel_Door.glb" />
    <link rel="preload" as="fetch" crossorigin href="/models/building/lightmaps/walls-nz.webp" />
    <link rel="preload" as="fetch" crossorigin href="/models/building/lightmaps/walls-pz.webp" />
    <link rel="preload" as="fetch" crossorigin href="/models/building/lightmaps/walls-nx.webp" />
    <link rel="preload" as="fetch" crossorigin href="/models/building/lightmaps/walls-px.webp" />
    <link rel="preload" as="fetch" crossorigin href="/models/building/textures/BuildingPart_Floor_A_BaseColor.webp" />
    <link rel="preload" as="fetch" crossorigin href="/models/building/textures/BuildingPart_FloorMacro_BaseColor.webp" />
    <link rel="preload" as="fetch" crossorigin href="/models/building/textures/BuildingPart_Fan_A_BaseColor.webp" />
    <link rel="preload" as="fetch" crossorigin href="/models/building/textures/BuildingPart_Framing_01_BaseColor.webp" />
    <link rel="preload" as="fetch" crossorigin href="/models/building/textures/BuildingPart_Framing_02_BaseColor.webp" />
    <link rel="preload" as="fetch" crossorigin href="/models/building/textures/BuildingPart_Roof_01_BaseColor.webp" />
    <link rel="preload" as="fetch" crossorigin href="/models/building/textures/BuildingPart_Light_A_BaseColor.webp" />
    <link rel="preload" as="fetch" crossorigin href="/models/building/textures/BuildingPart_Light_A_Emissive.webp" />
    <link rel="preload" as="fetch" crossorigin href="/models/building/textures/BuildingPart_Wall_01_BaseColor.webp" />
    <link rel="preload" as="fetch" crossorigin href="/models/building/textures/BuildingPart_Wall_02_BaseColor.webp" />

    <title>Open Industry Project</title>

    <!--
      Boot skeleton: the app's silhouette, painted from static markup as soon as this document
      loads, well ahead of the module graph that draws the real one.

      Without it the window is blank for the whole first load. On the prod build through the real
      host config, throttled to the profile verify-first-load uses, it takes first-contentful-paint
      from 7286 ms to 1210 ms. (In dev, styles.css is in the module graph, so without the skeleton
      the page is white until the graph loads. Prod extracts it to a <link>, so there it is dark.)

      On the desktop, Electron's maximize() shows the window at ~320 ms (apps/desktop/main.cjs), and
      it stays empty until the document loads. A splash window in front of it can't do this job: the
      window that needs filling is this one, and a second window cannot be sized to line up with a
      page (main.cjs has the measurements). Apple's HIG launch screen and Android 12's splash API
      follow the same pattern: the pre-paint state matches the first screen, so the transition is a
      fill-in rather than a cut.

      It mirrors .app's grid at the default dock sizes and tab strips, and the logo block is
      .viewport-cover's, so
      the real cover puts the logo in the same rect at the same size and nothing moves when React
      commits. Defaults are the right target even though the sizes persist per user: the visitor this
      exists for is the one arriving cold, who has no saved layout. The returning user whose
      layout differs is also the one whose graph is already cached, so their skeleton is on screen
      for a moment. Below MOBILE_QUERY the docks aren't in the layout at all, so neither are they
      here.

      Everything here is a copy of a value that lives in the app, so bootSkeleton.test.ts reads both
      files and fails if any of them drifts: the four colours (styles.css :root), the dock sizes
      (App.tsx DEFAULT_SIZES, and the front bottom panel's dockLayout.ts DEFAULT_BOTTOM_HEIGHT), the grid's
      shape (dockLayout.ts buildDockGrid), each dock's tabs in order (dockLayout.ts defaultDockLayout), the logo
      rule (.viewport-cover-logo) and the mobile breakpoint. Kept
      inline (no extra request) and script-free. App.tsx removes it in a layout effect, i.e. before
      the first frame that has the real UI in it. No spinner, for the reason ViewportLoadingCover
      documents at length: a stalled animation reads as a hang, and this phase is exactly when the
      main thread stalls.
    -->
    <style>
      /* styles.css's `* { box-sizing: border-box }` has not loaded either, and without it a band's
         border sits outside its height: the phone toolbar would be 49px against the app's 48. */
      /* both themes, like styles.css: the root's color-scheme picks, and the script above has already
         stamped a stored Light or Dark choice on <html> (src/editor/appearance.ts) */
      :root {
        color-scheme: light dark;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
      }
      :root[data-theme='light'] {
        color-scheme: light;
      }
      #boot-skeleton,
      #boot-skeleton * {
        box-sizing: border-box;
      }
      #boot-skeleton {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        background: light-dark(#ffffff, #17181b);
        /* styles.css is still in the module graph at this point, so every rule here has to name its
           own family: anything relying on inheritance renders in the browser's default serif */
        font: 12px/1.45 system-ui, 'Segoe UI', sans-serif;
        letter-spacing: 0.04em;
        user-select: none;
        grid-template-rows: 48px minmax(0, 1fr) 6px 200px;
        grid-template-columns: 260px 6px minmax(0, 1fr) 6px 320px;
        /* the bottom dock stops at the Inspector's column, which runs the full height (buildDockGrid) */
        grid-template-areas:
          'toolbar toolbar toolbar toolbar toolbar'
          'left gutl viewport gutr inspector'
          'gutd gutd gutd gutr inspector'
          'dock dock dock gutr inspector';
      }
      /* every cell is a panel band… */
      #boot-skeleton > div {
        background: light-dark(#f5f6f7, #202225);
      }
      /* …except the resize gutters, and the viewport itself */
      #boot-skeleton :is(.bs-gutl, .bs-gutr, .bs-gutd) {
        background: light-dark(#e0e2e5, #2e3136);
      }
      #boot-skeleton .bs-toolbar {
        grid-area: toolbar;
        border-bottom: 1px solid light-dark(#e0e2e5, #2e3136);
        /* = .toolbar: the same three-column grid, so each ghosted cluster sits where its real one
           will (left at the padding edge, the run cluster on the window's centre, the rest at the
           right end). A flex row would drift the middle group as the side groups filled in. */
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding: 0 12px;
      }
      #boot-skeleton .bs-tb-left {
        justify-self: start;
      }
      #boot-skeleton .bs-tb-run {
        justify-self: center;
      }
      #boot-skeleton .bs-tb-right {
        justify-self: end;
      }
      #boot-skeleton :is(.bs-tb-left, .bs-tb-run, .bs-tb-right) {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      /* Ghosts, not mock buttons. Shape only, no labels, because a toolbar's contents are state
         (Run becomes Stop, the scene name is the user's) where a dock's tab strip is not. They wear
         the app's own button fill and its own `button:disabled` opacity, so this is the shade the
         app itself uses for a control you cannot press yet, rather than an invented placeholder
         grey. Widths are measured off the real toolbar (e2e/probes/toolbar-metrics.mjs) so the
         clusters occupy roughly the room they are about to need. */
      #boot-skeleton .bs-ghost {
        /* = the toolbar's --toolbar-control, the one height every control in the row has */
        height: 28px;
        border-radius: 4px;
        background: light-dark(#e6e7e9, #2c2f33);
        border: 1px solid light-dark(#c9ccd1, #3a3e44);
        opacity: 0.4;
      }
      /* = .run-transport.segmented: Play, Pause and Stop joined, neighbours overlapping by 1px */
      #boot-skeleton .bs-transport {
        display: flex;
      }
      #boot-skeleton .bs-transport > .bs-ghost {
        border-radius: 0;
      }
      #boot-skeleton .bs-transport > .bs-ghost + .bs-ghost {
        margin-left: -1px;
      }
      #boot-skeleton .bs-transport > .bs-ghost:first-child {
        border-radius: 4px 0 0 4px;
      }
      #boot-skeleton .bs-transport > .bs-ghost:last-child {
        border-radius: 0 4px 4px 0;
      }
      /* the one toolbar element that is neither state nor surface-specific: the mark sits at the
         left end on the web (img.toolbar-logo) and inside the menu button in the desktop shell */
      #boot-skeleton .bs-mark {
        width: 24px;
        height: 24px;
        opacity: 0.55;
      }
      /* the project menu, at its default name ("Untitled Project"): a new project has one scene, so the menu
         names only the project. It keeps that width on a phone; Share shrinks there */
      #boot-skeleton .bs-project {
        width: 128px;
      }
      #boot-skeleton .bs-share {
        width: 80px;
      }
      /* The right-hand group ghosts only its tail (Share, Pilot, Distraction-free | Settings, Help), because that
         is the part every desktop surface shares. What sits left of it depends on things static CSS
         cannot see: the live-room chip and the view-only pill. The group is right-aligned, so those fill
         in to the left of the tail at the handover and nothing that was ghosted moves. The "..." ghost is
         the phone's, where it is always there. */
      #boot-skeleton .bs-icon {
        width: 32px;
      }
      #boot-skeleton .bs-more {
        display: none;
        width: 34px;
      }
      /* = .toolbar-sep: a divider, not a control, so it is drawn at full strength rather than ghosted */
      #boot-skeleton .bs-sep {
        width: 1px;
        height: 18px;
        background: light-dark(#c9ccd1, #3a3e44);
      }
      /* = the desktop shell's inset for its window buttons (styles.css, .toolbar-right in .desktop-shell).
         The overlay's geometry is there from the first paint, before any script, and without the shell
         both env() fall back so this is 0: the one shell difference this markup can honour. */
      #boot-skeleton .bs-tb-right {
        margin-right: calc(100vw - env(titlebar-area-width, 100vw) - env(titlebar-area-x, 0px));
      }
      #boot-skeleton .bs-left {
        grid-area: left;
      }
      #boot-skeleton .bs-gutl {
        grid-area: gutl;
      }
      #boot-skeleton .bs-gutr {
        grid-area: gutr;
      }
      #boot-skeleton .bs-right {
        grid-area: inspector;
      }
      #boot-skeleton .bs-gutd {
        grid-area: gutd;
      }
      #boot-skeleton .bs-dock {
        grid-area: dock;
      }
      /* phone only: see the media query at the end */
      #boot-skeleton .bs-tabbar {
        display: none;
      }
      #boot-skeleton .bs-viewport {
        grid-area: viewport;
        /* = .viewport-cover: dark in either theme */
        color-scheme: dark;
        background: light-dark(#ffffff, #17181b);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        color: light-dark(#61666c, #8b9097);
      }
      /* Every dock slot has a tab strip, in every layout and on every scene. It is the app's own
         chrome rather than any particular content, which is why it can be drawn before there is any.
         These mirror .dock-slot-tabs / .dock-slot-tab / .dock-slot-tab.active in styles.css, rules
         and all rather than a measured height, so the strip comes out the height the real one does. */
      #boot-skeleton .bs-tabs {
        display: flex;
        gap: 2px;
        padding: 4px 4px 0;
        border-bottom: 1px solid light-dark(#e0e2e5, #2e3136);
      }
      #boot-skeleton .bs-tab {
        padding: 4px 12px;
        border: 1px solid transparent;
        border-bottom: none;
        border-radius: 5px 5px 0 0;
        color: light-dark(#61666c, #8b9097);
        font-size: 12px;
        font-weight: 600;
      }
      #boot-skeleton .bs-tab.bs-on {
        background: light-dark(#ffffff, #17181b);
        color: light-dark(#212428, #d7dade);
        border-color: light-dark(#e0e2e5, #2e3136);
      }
      #boot-skeleton img {
        width: min(46%, 280px);
        aspect-ratio: 850 / 296.98;
        max-height: 45%;
        object-fit: contain;
        -webkit-user-drag: none;
      }
      /* = MOBILE_QUERY (App.tsx): below this the docks become drawers, so the columns go. But the
         shell is not just toolbar + viewport. Two things change shape with them, and both are chrome
         that is on screen the whole time (styles.css, .app.mobile .toolbar / .mobile-tabbar):
           - the toolbar grows by the top safe-area inset, so it is a min-height and an auto row here
             rather than a flat 48px, or the logo below it sits an inset too high on a notched phone,
           - a fixed bottom tab bar appears, over the viewport rather than in the grid. The viewport
             runs under it exactly as it does in the app, so .viewport-cover centres its logo against
             the full height and this has to as well, so this is a positioned band, not a row. */
      @media (max-width: 820px), (orientation: landscape) and (max-height: 560px) {
        #boot-skeleton {
          grid-template-rows: auto minmax(0, 1fr);
          grid-template-columns: minmax(0, 1fr);
          grid-template-areas:
            'toolbar'
            'viewport';
        }
        #boot-skeleton :is(.bs-left, .bs-right, .bs-dock, .bs-gutl, .bs-gutr, .bs-gutd) {
          display: none;
        }
        #boot-skeleton .bs-toolbar {
          height: auto;
          min-height: calc(48px + env(safe-area-inset-top));
          padding-top: env(safe-area-inset-top);
          /* = .app.mobile .toolbar: sticky, so WebKit fills the status-bar strip with this row's colour
             instead of iOS's Liquid Glass blur (styles.css has why) - or the boot frames would blur
             where the app's do not */
          position: sticky;
          top: 0;
        }
        /* = .app.mobile .toolbar: flow order rather than a centred middle column, and the mark goes
           with the title (styles.css drops both on touch) */
        #boot-skeleton .bs-toolbar {
          display: flex;
          justify-content: space-between;
        }
        #boot-skeleton .bs-mark {
          display: none;
        }
        #boot-skeleton .bs-share {
          width: 42px;
        }
        /* = the phone's cuts: sim speed and the icon buttons leave the bar, the "..." is always there */
        #boot-skeleton :is(.bs-speed, .bs-icon, .bs-sep) {
          display: none;
        }
        #boot-skeleton .bs-more {
          display: block;
        }
        #boot-skeleton .bs-tabbar {
          display: block;
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          height: calc(54px + env(safe-area-inset-bottom));
          background: light-dark(#f5f6f7, #202225);
          border-top: 1px solid light-dark(#e0e2e5, #2e3136);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-skeleton" aria-hidden="true">
      <div class="bs-toolbar">
        <div class="bs-tb-left">
          <img class="bs-mark" src="/oip-icon.svg" alt="" />
          <span class="bs-ghost bs-project"></span>
        </div>
        <div class="bs-tb-run">
          <span class="bs-transport">
            <span class="bs-ghost" style="width: 40px"></span>
            <span class="bs-ghost" style="width: 40px"></span>
            <span class="bs-ghost" style="width: 40px"></span>
          </span>
          <span class="bs-ghost bs-speed" style="width: 40px; margin-left: 4px"></span>
        </div>
        <div class="bs-tb-right">
          <span class="bs-ghost bs-more"></span>
          <span class="bs-ghost bs-share"></span>
          <span class="bs-ghost bs-icon"></span>
          <span class="bs-ghost bs-icon"></span>
          <span class="bs-sep"></span>
          <span class="bs-ghost bs-icon"></span>
          <span class="bs-ghost bs-icon"></span>
        </div>
      </div>
      <div class="bs-left">
        <div class="bs-tabs"><span class="bs-tab bs-on">Scene</span><span class="bs-tab">History</span></div>
      </div>
      <div class="bs-gutl"></div>
      <div class="bs-viewport">
        <img src="/oip-logo.svg" alt="" />
        <div>Loading…</div>
      </div>
      <div class="bs-gutr"></div>
      <div class="bs-right">
        <div class="bs-tabs"><span class="bs-tab bs-on">Inspector</span></div>
      </div>
      <div class="bs-tabbar"></div>
      <div class="bs-gutd"></div>
      <div class="bs-dock">
        <div class="bs-tabs"><span class="bs-tab bs-on">Parts</span><span class="bs-tab">PLC</span><span class="bs-tab">Problems</span><span class="bs-tab">Watch</span></div>
      </div>
    </div>
    <!-- The tabs above in the editor's language, from the translations a past visit cached
         (src/editor/autoTranslate.ts), so the handover to the app's own tabs keeps their words. A tab is matched
         by its English text against the `dock.panel.*` messages (src/editor/dockLayout.ts). -->
    <script>
      try {
        if (localStorage.getItem('oip-web/language') !== 'en') {
          var cache = JSON.parse(localStorage.getItem('oip-web/translations') || 'null')
          var lang = ((navigator.languages && navigator.languages[0]) || navigator.language || '').trim()
          if (cache && cache.lang === lang && cache.entries) {
            var tabs = document.querySelectorAll('#boot-skeleton .bs-tab')
            for (var i = 0; i < tabs.length; i++) {
              for (var id in cache.entries) {
                var entry = cache.entries[id]
                if (id.indexOf('dock.panel.') === 0 && entry[0] === tabs[i].textContent) {
                  tabs[i].textContent = entry[1]
                  break
                }
              }
            }
          }
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/editor/main.tsx"></script>
  </body>
</html>
